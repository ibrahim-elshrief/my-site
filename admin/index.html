<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم - الأعمال</title>
<style>
  body { font-family: Tahoma, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
  h1 { color: #222; }
  .card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  label { display: block; margin-top: 10px; font-weight: bold; }
  input[type=text], textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  textarea { min-height: 80px; }
  button { margin-top: 15px; padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  button.danger { background: #dc2626; }
  .work-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
  .work-item:last-child { border-bottom: none; }
  .status { margin-top: 10px; font-weight: bold; }
  .status.ok { color: green; }
  .status.err { color: red; }
</style>
</head>
<body>

<h1>لوحة التحكم — الأعمال (Portfolio)</h1>

<div class="card">
  <h2>إضافة عمل جديد</h2>
  <label>العنوان</label>
  <input type="text" id="title">

  <label>الوصف</label>
  <textarea id="description"></textarea>

  <label>التصنيف (مثلاً: صورة / فيديو / بحث / كتاب)</label>
  <input type="text" id="category">

  <label>الملف (اختياري)</label>
  <input type="file" id="fileInput">

  <button onclick="addWork()">حفظ العمل</button>
  <div id="addStatus" class="status"></div>
</div>

<div class="card">
  <h2>الأعمال الحالية</h2>
  <div id="worksList">جاري التحميل...</div>
</div>

<script>
async function loadWorks() {
  const res = await fetch('/api/works');
  const data = await res.json();
  const container = document.getElementById('worksList');
  container.innerHTML = '';

  if (!data.success || data.data.length === 0) {
    container.innerHTML = '<p>لا يوجد أعمال حتى الآن.</p>';
    return;
  }

  data.data.forEach(work => {
    const div = document.createElement('div');
    div.className = 'work-item';
    div.innerHTML = `
      <div>
        <strong>${escapeHtml(work.title)}</strong> (${escapeHtml(work.category || '')})<br>
        <small>${escapeHtml(work.description || '')}</small><br>
        ${work.file_url ? `<a href="${work.file_url}" target="_blank">عرض الملف</a>` : ''}
      </div>
      <button class="danger" onclick="deleteWork(${work.id})">حذف</button>
    `;
    container.appendChild(div);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]); // شيل الجزء "data:...;base64,"
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function addWork() {
  const title = document.getElementById('title').value.trim();
  const description = document.getElementById('description').value.trim();
  const category = document.getElementById('category').value.trim();
  const fileInput = document.getElementById('fileInput');
  const statusEl = document.getElementById('addStatus');

  if (!title) {
    statusEl.textContent = 'لازم تكتب عنوان للعمل';
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = 'جاري الحفظ...';
  statusEl.className = 'status';

  const payload = { title, description, category };

  if (fileInput.files.length > 0) {
    const file = fileInput.files[0];
    payload.fileData = await fileToBase64(file);
    payload.fileName = file.name;
    payload.mimeType = file.type || 'application/octet-stream';
  }

  const res = await fetch('/api/works', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await res.json();

  if (data.success) {
    statusEl.textContent = 'تم الحفظ بنجاح ✅';
    statusEl.className = 'status ok';
    document.getElementById('title').value = '';
    document.getElementById('description').value = '';
    document.getElementById('category').value = '';
    fileInput.value = '';
    loadWorks();
  } else {
    statusEl.textContent = 'حصل خطأ: ' + data.error;
    statusEl.className = 'status err';
  }
}

async function deleteWork(id) {
  if (!confirm('متأكد إنك عايز تحذف العمل ده؟')) return;

  const res = await fetch('/api/works', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  const data = await res.json();

  if (data.success) {
    loadWorks();
  } else {
    alert('حصل خطأ أثناء الحذف: ' + data.error);
  }
}

loadWorks();
</script>

</body>
</html>
